<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080D15">
  <title>Requests — Northstar Service desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Northstar Service desk home">Northstar <span>Service desk</span></a>
    <span class="signed-in">IT staff</span>
  </header>

  <main>
    <div class="page-heading">
      <div class="heading-copy">
        <p class="page-kicker">Service operations</p>
        <h1>Requests<span class="title-period">.</span></h1>
        <p class="page-caption">Your team's working queue.</p>
      </div>
      <div class="open-indicator" aria-live="polite">
        <span>Open now</span>
        <strong id="openCount">—</strong>
      </div>
      <button class="button primary" id="newRequest" type="button">New request</button>
    </div>
    <nav class="filters" id="filters" aria-label="Filter requests"></nav>
    <p class="toast" id="message" role="status" aria-live="polite"></p>
    <section aria-label="Request queue">
      <div class="table-wrap" id="list"></div>
    </section>
  </main>

  <dialog class="request-dialog" id="requestDialog" aria-labelledby="formTitle">
    <div class="dialog-heading">
      <div>
        <h2 id="formTitle">New request</h2>
        <p>Share the details so the service desk can help.</p>
      </div>
      <button class="icon-button" id="closeDialog" type="button" aria-label="Close request form">×</button>
    </div>
    <form id="requestForm">
      <input type="hidden" id="requestId">
      <label for="requesterName">Your name</label>
      <input id="requesterName" name="requesterName" required autocomplete="name">

      <label for="title">What's the issue?</label>
      <input id="title" name="title" required maxlength="160">

      <label for="description">Describe what happened and what you've tried</label>
      <textarea id="description" name="description" rows="5" required></textarea>

      <div class="form-row">
        <div>
          <label for="category">Area</label>
          <select id="category" name="category">
            <option>Hardware</option>
            <option>Software</option>
            <option>Network</option>
            <option>Accounts and access</option>
            <option>Security</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label for="priority">Urgency</label>
          <select id="priority" name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button class="button primary" type="submit" id="submitBtn">Send request</button>
        <button class="button secondary" type="button" id="cancelBtn">Cancel</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
